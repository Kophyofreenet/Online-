<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Users Status List</title>
    <style>
        :root {
            --bg-primary: #f8f9fa;
            --bg-secondary: #fff;
            --text-primary: #333;
            --text-secondary: #2c3e50;
            --border-color: #e0e0e0;
            --table-header-bg: linear-gradient(to bottom, #3498db, #2980b9);
            --table-row-even: #f8f9fa;
            --table-row-hover: #e8f4fc;
            --total-users-bg: linear-gradient(to right, #3498db, #2c3e50);
            --status-busy: #e74c3c;
            --status-online: #2ecc71;
            --status-offline: #95a5a6;
            --status-full: #9b59b6;
            --user-count-low: #2ecc71;
            --user-count-high: #e74c3c;
        }

        .dark-mode {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --text-primary: #e0e0e0;
            --text-secondary: #f0f0f0;
            --border-color: #444;
            --table-header-bg: linear-gradient(to bottom, #2c3e50, #1a2a3e);
            --table-row-even: #363636;
            --table-row-hover: #3a4a5c;
            --total-users-bg: linear-gradient(to right, #2c3e50, #1a2a3e);
            --status-busy: #c0392b;
            --status-online: #27ae60;
            --status-offline: #7f8c8d;
            --status-full: #8e44ad;
            --user-count-low: #27ae60;
            --user-count-high: #c0392b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            color: var(--text-primary);
            background-color: var(--bg-primary);
            transition: background-color 0.3s, color 0.3s;
            padding-bottom: 70px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            background-color: var(--bg-secondary);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: var(--text-secondary);
            border-bottom: 2px solid #3498db;
            padding-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 16px;
            text-align: left;
        }

        th {
            background: var(--table-header-bg);
            color: white;
        }

        tr:nth-child(even) { background-color: var(--table-row-even); }
        tr:hover { background-color: var(--table-row-hover); }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-online { background-color: var(--status-online); box-shadow: 0 0 8px var(--status-online); }
        .status-offline { background-color: var(--status-offline); }
        .status-full { background-color: var(--status-full); }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            margin-top: 5px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s;
        }

        .ping-time {
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .ping-good { background: #e8f6ef; color: #2ecc71; }
        .ping-bad { background: #fbebee; color: #e74c3c; }

        .total-users {
            text-align: center;
            padding: 20px;
            background: var(--total-users-bg);
            color: white;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #3498db;
            color: white;
            cursor: pointer;
            font-size: 1.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .flag { width: 25px; vertical-align: middle; margin-right: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌐 Servers List: Online Users</h1>
        <div style="text-align:center; color: #7f8c8d; margin-bottom: 10px;">🖥️ လူသုံးနည်းတဲ့ဆာဗာတွေရွေးချယ်ပြီးသုံးပါ</div>
        
        <table id="serverTable">
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Server Name</th>
                    <th>Users / Capacity</th>
                    <th>Ping</th>
                </tr>
            </thead>
            <tbody id="serverBody">
                <tr>
                    <td colspan="4" style="text-align: center;">Fetching data from JSON...</td>
                </tr>
            </tbody>
        </table>

        <div class="total-users">Total Online Active: <span id="totalOnlineCount">0</span> Users</div>
        <div id="lastUpdated" style="text-align:right; font-size: 0.8em; margin-top: 10px; color: #7f8c8d;">Last updated: -</div>
    </div>

    <button class="theme-toggle" id="themeToggle">🌙</button>

    <script>
        const API_URL = 'https://raw.githubusercontent.com/Kophyofreenet/Online-/refs/heads/main/Onlineapi.json';
        const SERVER_LIMIT = 250;

        async function fetchServerData() {
            try {
                const response = await fetch(API_URL);
                const servers = await response.json();
                renderTable(servers);
            } catch (error) {
                console.error("Error loading JSON:", error);
                document.getElementById('serverBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">Failed to load API data.</td></tr>';
            }
        }

        async function getPing(url) {
            const start = Date.now();
            try {
                // We use a small timeout for ping
                await fetch(url, { mode: 'no-cors', cache: 'no-cache' });
                return Date.now() - start;
            } catch (e) {
                return "Error";
            }
        }

        async function renderTable(servers) {
            const tbody = document.getElementById('serverBody');
            tbody.innerHTML = '';
            let totalUsers = 0;

            for (const server of servers) {
                const row = document.createElement('tr');
                
                // Fetch user count (Assuming your API gives it or we fetch from server URL)
                // If API only contains URLs, we fetch from each. 
                // Based on your previous code, let's fetch the text response from the URL.
                let onlineCount = 0;
                let ping = "--";
                
                try {
                    const start = Date.now();
                    // Using a CORS proxy as in your original script
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(server.url)}`;
                    const res = await fetch(proxyUrl);
                    const text = await res.text();
                    onlineCount = parseInt(text) || 0;
                    if (onlineCount > SERVER_LIMIT) onlineCount = SERVER_LIMIT;
                    ping = Date.now() - start;
                } catch (e) {
                    onlineCount = 0;
                    ping = "Error";
                }

                totalUsers += onlineCount;
                const percent = Math.round((onlineCount / SERVER_LIMIT) * 100);
                const status = onlineCount >= SERVER_LIMIT ? "Full" : (onlineCount > 0 ? "Online" : "Offline");
                const statusClass = onlineCount >= SERVER_LIMIT ? "status-full" : (onlineCount > 0 ? "status-online" : "status-offline");
                
                const countryCode = server.name.split('-')[0].toLowerCase();
                const pingClass = typeof ping === 'number' && ping < 300 ? 'ping-good' : 'ping-bad';

                row.innerHTML = `
                    <td><span class="status-indicator ${statusClass}"></span>${status}</td>
                    <td><img src="https://flagcdn.com/w40/${countryCode}.png" class="flag"> ${server.name}</td>
                    <td>
                        <div style="display:flex; justify-content:space-between; font-size:0.9em;">
                            <span>${onlineCount} / ${SERVER_LIMIT}</span>
                            <span>${percent}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${percent}%; background: ${percent > 80 ? '#e74c3c' : '#2ecc71'}"></div>
                        </div>
                    </td>
                    <td><span class="ping-time ${pingClass}">${ping} ${typeof ping === 'number' ? 'ms' : ''}</span></td>
                `;
                tbody.appendChild(row);
            }

            document.getElementById('totalOnlineCount').textContent = totalUsers;
            document.getElementById('lastUpdated').textContent = "Last updated: " + new Date().toLocaleString();
        }

        // Theme Toggle
        const themeBtn = document.getElementById('themeToggle');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            themeBtn.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        });

        // Run
        fetchServerData();
        setInterval(fetchServerData, 60000); // Auto refresh every 1 min
    </script>
</body>
</html>
